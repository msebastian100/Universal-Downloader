name: Store MSIX

on:
  workflow_dispatch:

jobs:
  build-windows-msix:
    name: MSIX ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: python build_windows.py

      - name: Pack unsigned MSIX
        run: powershell -ExecutionPolicy Bypass -File packaging/msix/build_store_msix.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-${{ matrix.arch }}
          path: dist_msix/*.msix
          retention-days: 30
